name: release verification

on:
  push:
    branches: [main, recovery/phase8-20260925, codex/phase12-release]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: phase12-test-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      USE_MOCK_AI: "true"
      OPENAI_API_KEY: ""
      SLACK_WEBHOOK_URL: ""
      LORA_INFERENCE_BASE_URL: ""
      LORA_INFERENCE_API_KEY: ""
      SESSION_COOKIE_SECURE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ""
      API_PROXY_TARGET: http://127.0.0.1:18000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the audited backend lock
        run: python -m pip install --require-hashes -r backend/requirements-lock.txt
      - name: Create disposable databases
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:phase12-test-only@127.0.0.1:5432/postgres", autocommit=True) as connection:
              connection.execute("CREATE DATABASE gtmflow_phase12_test")
              connection.execute("CREATE DATABASE gtmflow_phase12_release")
          PY
      - name: Complete backend suite (SQLite)
        working-directory: backend
        run: python -m pytest -q
      - name: Complete backend suite (isolated PostgreSQL)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:phase12-test-only@127.0.0.1:5432/gtmflow_phase12_test
        run: python -m pytest -q
      - name: Frontend clean install, complete suite, typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: PostgreSQL migrations and live mock release flow through the production frontend
        working-directory: backend
        run: >-
          python scripts/verify_release.py --with-frontend
          --database-url postgresql+psycopg://postgres:phase12-test-only@127.0.0.1:5432/gtmflow_phase12_release
